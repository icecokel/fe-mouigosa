name: Check questions and build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate question bank and 1,000 generated exams
        run: npm run check
      - name: Build static site
        run: npm run build
        env:
          PAGES_BASE_PATH: /fe-mouigosa
