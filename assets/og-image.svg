<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">2026학년도 프론트엔드 개발자 모의평가</title>
  <desc id="desc">흰 시험지에 제 1교시 프론트엔드 영역 제목과 2단 문제, 검은 동그라미 선택지가 인쇄된 공유 이미지</desc>

  <rect width="1200" height="630" fill="#ECECE8"/>
  <rect x="30" y="22" width="1140" height="586" fill="#FFFFFF" stroke="#D8D8D2" stroke-width="2"/>

  <g fill="#111111">
    <text x="600" y="91" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="27" font-weight="700" letter-spacing="-1">2026학년도 프론트엔드 개발자 모의평가</text>
    <rect x="96" y="153" width="142" height="48" rx="24" fill="none" stroke="#222222" stroke-width="2"/>
    <text x="167" y="185" text-anchor="middle" font-family="Nanum Myeongjo, serif" font-size="23" font-weight="700">제 1교시</text>
    <text x="600" y="202" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="67" font-weight="800" letter-spacing="-3">프론트엔드 영역</text>
  </g>

  <line x1="94" y1="235" x2="1106" y2="235" stroke="#222222" stroke-width="3"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#595954">
    <text x="99" y="280">성명</text>
    <text x="381" y="280">수험번호</text>
    <text x="904" y="280">100점 만점 · 20분</text>
  </g>
  <line x1="149" y1="286" x2="340" y2="286" stroke="#D8D8D2" stroke-width="2"/>
  <line x1="476" y1="286" x2="777" y2="286" stroke="#D8D8D2" stroke-width="2"/>
  <line x1="94" y1="313" x2="1106" y2="313" stroke="#D8D8D2" stroke-width="2"/>

  <line x1="600" y1="341" x2="600" y2="561" stroke="#222222" stroke-width="1"/>

  <g fill="#111111">
    <text x="101" y="362" font-family="Nanum Myeongjo, serif" font-size="28" font-weight="700">1.</text>
    <text x="137" y="361" font-family="Nanum Myeongjo, serif" font-size="23" font-weight="700">다음 코드의 결과로 옳은 것은?</text>
    <text x="534" y="360" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" fill="#595954">[4점]</text>
  </g>
  <rect x="133" y="383" width="426" height="78" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <g fill="#111111" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
    <text x="152" y="413">const value = [1, 2, 3]</text>
    <text x="152" y="441">  .map((n) =&gt; n * 2);</text>
  </g>

  <g font-family="Nanum Myeongjo, serif" font-size="20" fill="#111111">
    <circle cx="144" cy="489" r="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="144" y="496" text-anchor="middle" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700">1</text>
    <text x="165" y="496">[1, 2, 3]</text>
    <circle cx="351" cy="489" r="12" fill="#111111"/>
    <text x="351" y="496" text-anchor="middle" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="372" y="496" font-weight="700">[2, 4, 6]</text>
    <circle cx="144" cy="523" r="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="144" y="530" text-anchor="middle" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700">3</text>
    <text x="165" y="530">[2, 3, 4]</text>
    <circle cx="351" cy="523" r="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="351" y="530" text-anchor="middle" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700">4</text>
    <text x="372" y="530">undefined</text>
    <circle cx="144" cy="553" r="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="144" y="560" text-anchor="middle" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700">5</text>
    <text x="165" y="560">TypeError</text>
  </g>

  <g fill="#111111">
    <text x="638" y="362" font-family="Nanum Myeongjo, serif" font-size="28" font-weight="700">2.</text>
    <text x="674" y="361" font-family="Nanum Myeongjo, serif" font-size="23" font-weight="700">렌더링 순서로 옳은 것은?</text>
    <text x="1070" y="360" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" fill="#595954">[3점]</text>
  </g>
  <g font-family="Nanum Myeongjo, serif" font-size="19" fill="#111111">
    <text x="647" y="405">①</text><text x="679" y="405">DOM → 스타일 → 레이아웃 → 페인트</text>
    <text x="647" y="439">②</text><text x="679" y="439">스타일 → DOM → 페인트 → 레이아웃</text>
    <text x="647" y="473">③</text><text x="679" y="473">페인트 → 레이아웃 → DOM → 스타일</text>
    <text x="647" y="507">④</text><text x="679" y="507">레이아웃 → 페인트 → 스타일 → DOM</text>
    <text x="647" y="541">⑤</text><text x="679" y="541">DOM → 페인트 → 레이아웃 → 스타일</text>
  </g>

  <line x1="94" y1="576" x2="1106" y2="576" stroke="#D8D8D2" stroke-width="1"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#595954">
    <text x="94" y="596">fe-mouigosa</text>
    <text x="1106" y="596" text-anchor="end">1 / 1</text>
  </g>
</svg>
